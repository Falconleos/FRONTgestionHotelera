<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="fa-solid fa-boxes-stacked me-2"></i> Gestión de Ítems</h2>
    <button 
      class="btn btn-primary" 
      [routerLink]="isAdmin ? '/dashboard/items/nuevo' : null" 
      [disabled]="!isAdmin">
      <i class="fa-solid fa-plus me-1"></i> Nuevo Ítem
    </button>
  </div>
  <hr class="mb-4">

  <!-- Mensajes de carga o error -->
  <div *ngIf="loading" class="alert alert-info mb-4">
    <i class="fa-solid fa-spinner fa-spin me-2"></i> Cargando registros...
  </div>
  <div *ngIf="errorMessage" class="alert alert-danger mb-4">
    <i class="fa-solid fa-triangle-exclamation me-2"></i> {{ errorMessage }}
  </div>

  <!-- Cuadrícula de Cards de Ítems con Estilo Glass -->
  <div *ngIf="!loading && !errorMessage && items.length > 0" class="row">
    <div class="col-md-3 mb-4" *ngFor="let item of items">
      <div class="glass-card h-100">
        <div class="card-body d-flex flex-column justify-content-between">
          <div>
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="text-subtitle small">ID: #{{ item.id }}</span>
              <span class="badge" [ngClass]="{
                'badge-info-glass': item.isService, 
                'badge-secondary-glass': !item.isService
              }">
                {{ item.isService ? 'Servicio' : 'Ítem' }}
              </span>
            </div>
            <h5 class="card-title text-main mb-2">{{ item.description }}</h5>
            <p class="card-text mb-1 small text-subtitle"><strong>Cantidad:</strong> {{ item.quantity }}</p>
            <p class="card-text fw-bold text-success-price mb-3">${{ item.unitPrice | number:'1.2-2' }}</p>
          </div>
          
          <div class="d-flex justify-content-between gap-2 mt-2" *ngIf="isAdmin">
            <button 
              class="btn btn-warning btn-sm w-50" 
              [routerLink]="['/dashboard/items/editar', item.id]">
              <i class="fa-solid fa-pen-to-square"></i> Editar
            </button>
            <button 
              class="btn btn-danger btn-sm w-50" 
              (click)="deleteItem(item.id)">
              <i class="fa-solid fa-trash"></i> Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mensaje si la lista está vacía -->
  <div *ngIf="!loading && !errorMessage && items.length === 0" class="alert alert-warning text-center py-4">
    <i class="fa-solid fa-circle-exclamation me-2"></i> No se encontraron ítems registrados en el sistema.
  </div>
</div>
